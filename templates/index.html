<!DOCTYPE html>
<html>
<head>
    <title>Diabetes Prediction System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 50px;
        }

        .form-container {
            max-width: 550px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #333;
        }

        label {
            font-weight: bold;
        }

        .form-container input {
            width: 100%;
            padding: 10px;
            margin: 5px 0 20px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .form-container input[type="submit"] {
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        .form-container input[type="submit"]:hover {
            background-color: #218838;
        }

        .result {
            font-size: 1.3em;
            color: #007bff;
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="form-container">

        <h2>Diabetes Prediction System</h2>

        <form action="/predict" method="post">

            <label for="Pregnancies">Pregnancies:</label>
            <input type="number" name="Pregnancies" required>

            <label for="Glucose">Glucose Level:</label>
            <input type="number" name="Glucose" required>

            <label for="BloodPressure">Blood Pressure:</label>
            <input type="number" name="BloodPressure" required>

            <label for="SkinThickness">Skin Thickness:</label>
            <input type="number" name="SkinThickness" required>

            <label for="Insulin">Insulin Level:</label>
            <input type="number" name="Insulin" required>

            <label for="BMI">BMI:</label>
            <input type="number" step="0.1" name="BMI" required>

            <label for="DiabetesPedigreeFunction">
                Diabetes Pedigree Function:
            </label>
            <input type="number" step="0.001"
                   name="DiabetesPedigreeFunction" required>

            <label for="Age">Age:</label>
            <input type="number" name="Age" required>

            <input type="submit" value="Predict Diabetes">

        </form>

        {% if prediction_text %}
        <div class="result">
            {{ prediction_text }}
        </div>
        {% endif %}

    </div>

</body>
</html>
